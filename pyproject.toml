[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ood-gate"
version = "0.1.0"
description = "OOD evaluation and representation analysis for a frozen document classifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.48.3",
  "huggingface-hub==0.28.1",
  "numpy>=2.0,<3",
  "scipy==1.15.1",
  "scikit-learn==1.6.1",
  "pandas==2.2.3",
  "matplotlib==3.10.5",
  "pyarrow==19.0.0",
  "Pillow>=10.4,<12",
  "ImageHash==4.3.2",
  "PyYAML==6.0.2",
  "tqdm==4.67.1",
  "safetensors==0.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.6"]

[project.urls]
Repository = "https://github.com/Xinzhu-Yin/document-ood-gate"
Documentation = "https://github.com/Xinzhu-Yin/document-ood-gate/blob/main/docs/REPRODUCIBILITY.md"

[project.scripts]
doc-ood = "document_ood_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
